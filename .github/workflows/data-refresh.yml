name: Daily Data Refresh

on:
  schedule:
    # Run daily at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

env:
  PYTHON_VERSION: '3.9'

jobs:
  refresh-data:
    name: Refresh Mutual Fund Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright Browsers
        run: |
          playwright install chromium
      
      - name: Create Required Directories
        run: |
          mkdir -p data/extracted data/processed/chunks data/vector_db/chroma_db logs/phase3 logs/phase4
      
      # Phase 1: Data Extraction
      - name: Phase 1 - Extract Data from URLs
        id: phase1
        run: |
          echo "Running Phase 1: Data Extraction..."
          python src/pipeline.py || echo "PHASE1_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
      
      # Phase 2: Document Processing
      - name: Phase 2 - Process and Chunk Documents
        id: phase2
        run: |
          echo "Running Phase 2: Document Processing..."
          python src/chunking_pipeline.py || echo "PHASE2_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
      
      # Phase 3: Vector Database Indexing
      - name: Phase 3 - Index in Vector Database
        id: phase3
        run: |
          echo "Running Phase 3: Vector Database Indexing..."
          python src/indexing_pipeline.py || echo "PHASE3_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
      
      # Validate Data Quality
      - name: Validate Data Quality
        run: |
          echo "Validating data quality..."
          # Check if chunks were created
          if [ -f "data/processed/chunks/all_chunks.json" ]; then
            echo "✓ Chunks file exists"
            echo "Chunk count: $(cat data/processed/chunks/all_chunks.json | python -c "import json,sys; print(len(json.load(sys.stdin)))")"
          else
            echo "✗ Chunks file not found"
            exit 1
          fi
          
          # Check if vector DB was updated
          if [ -f "data/vector_db/chroma_db/chroma.sqlite3" ]; then
            echo "✓ Vector database exists"
          else
            echo "✗ Vector database not found"
            exit 1
          fi
      
      # Commit Updated Data (Optional)
      - name: Commit Updated Data
        id: commit
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add data files
          git add data/
          git add logs/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "🔄 Daily data refresh: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
      
      # Send Notification (Optional - requires setup)
      - name: Send Success Notification
        if: success()
        run: |
          echo "✅ Data refresh completed successfully!"
          echo "Date: $(date)"
          echo "Changes committed: ${{ env.HAS_CHANGES }}"
      
      - name: Send Failure Notification
        if: failure()
        run: |
          echo "❌ Data refresh failed!"
          echo "Date: $(date)"
          echo "Check logs for details."
  
  # Optional: Health Check Job
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: refresh-data
    if: always()
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Health Check
        run: |
          echo "Running health check..."
          # Simple test to verify data integrity
          python -c "
          import json
          import sys
          
          try:
              with open('data/processed/chunks/all_chunks.json', 'r') as f:
                  chunks = json.load(f)
              print(f'✓ Data health check passed: {len(chunks)} chunks available')
              sys.exit(0)
          except Exception as e:
              print(f'✗ Data health check failed: {e}')
              sys.exit(1)
          "
